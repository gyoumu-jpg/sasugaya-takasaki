name: 相場の自動更新

on:
  schedule:
    # 日本時間 10:05 と 17:20（田中貴金属の公表 9:30・17:00 の後）
    - cron: '5 1 * * *'
    - cron: '20 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 相場を取得してLPを再生成
        run: |
          python3 scripts/update_rates.py
          python3 src/build_site.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "rate-updater"
          git config user.email "rate-updater@users.noreply.github.com"
          git add src/Main.dc.html index.html
          git commit -m "相場を自動更新（田中貴金属 店頭買取価格）"
          git push
